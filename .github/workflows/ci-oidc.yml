name: ci-oidc
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read          # 최소 권한
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production          # 신뢰 정책의 sub 와 짝
    runs-on: ubuntu-latest
    permissions: { id-token: write } # OIDC 토큰 발급 권한
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2   # 필수 입력
      - run: aws sts get-caller-identity   # 누구로 전환됐는지 확인
